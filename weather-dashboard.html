<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .search-bar input {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            width: 300px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-bar button {
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-bar button:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .weather-card.main-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .weather-card.main-card h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .weather-card.main-card .temp {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .weather-card.main-card .description {
            font-size: 1.2rem;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .weather-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .info-item label {
            font-size: 0.9rem;
            opacity: 0.9;
            display: block;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .weather-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .weather-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .weather-detail:last-child {
            border-bottom: none;
        }

        .weather-detail label {
            color: #666;
            font-weight: 500;
        }

        .weather-detail .value {
            color: #333;
            font-weight: bold;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .forecast-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .forecast-item .day {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .forecast-item .icon {
            font-size: 2rem;
            margin: 10px 0;
        }

        .forecast-item .temp {
            color: #333;
            font-weight: bold;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .weather-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .search-bar input {
                width: 100%;
            }

            .weather-info {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .weather-card.main-card .temp {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information for any city</p>
        </div>

        <div class="search-bar">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="searchWeather()">Search</button>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <div class="weather-grid" id="weatherGrid">
            <div class="weather-card main-card">
                <h2 id="cityName">Select a city to see weather</h2>
                <div class="weather-icon" id="weatherIcon">🌍</div>
                <div class="description" id="description">Enter a city name to get started</div>
                <div class="weather-info" id="weatherInfo">
                    <div class="info-item">
                        <label>Temperature</label>
                        <div class="value" id="temp">--°C</div>
                    </div>
                    <div class="info-item">
                        <label>Feels Like</label>
                        <div class="value" id="feelsLike">--°C</div>
                    </div>
                    <div class="info-item">
                        <label>Humidity</label>
                        <div class="value" id="humidity">--%</div>
                    </div>
                    <div class="info-item">
                        <label>Wind Speed</label>
                        <div class="value" id="windSpeed">-- m/s</div>
                    </div>
                </div>
            </div>

            <div class="weather-card">
                <h3>Detailed Information</h3>
                <div class="weather-detail">
                    <label>Pressure</label>
                    <span class="value" id="pressure">-- hPa</span>
                </div>
                <div class="weather-detail">
                    <label>Visibility</label>
                    <span class="value" id="visibility">-- m</span>
                </div>
                <div class="weather-detail">
                    <label>UV Index</label>
                    <span class="value" id="uvIndex">--</span>
                </div>
                <div class="weather-detail">
                    <label>Sunrise</label>
                    <span class="value" id="sunrise">--:--</span>
                </div>
                <div class="weather-detail">
                    <label>Sunset</label>
                    <span class="value" id="sunset">--:--</span>
                </div>
            </div>

            <div class="weather-card">
                <h3>Air Quality</h3>
                <div class="weather-detail">
                    <label>AQI Level</label>
                    <span class="value" id="aqiLevel">--</span>
                </div>
                <div class="weather-detail">
                    <label>PM2.5</label>
                    <span class="value" id="pm25">-- μg/m³</span>
                </div>
                <div class="weather-detail">
                    <label>PM10</label>
                    <span class="value" id="pm10">-- μg/m³</span>
                </div>
            </div>

            <div class="weather-card">
                <h3>5-Day Forecast</h3>
                <div class="forecast-grid" id="forecastGrid">
                    <!-- Forecast items will be added here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'b6fd43b53d41a3f6a9f651fe8d625622'; // OpenWeatherMap API Key
        const BASE_URL = 'https://api.openweathermap.org/data/2.5';

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            showLoading(true);
            hideError();

            try {
                // Get coordinates
                const geoResponse = await fetch(
                    `${BASE_URL}/geo/1.0/direct?q=${city}&limit=1&appid=${API_KEY}`
                );
                const geoData = await geoResponse.json();

                if (!geoData.length) {
                    showError('City not found. Please try another city name.');
                    showLoading(false);
                    return;
                }

                const { lat, lon, name, country } = geoData[0];

                // Get weather data
                const weatherResponse = await fetch(
                    `${BASE_URL}/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`
                );
                const weatherData = await weatherResponse.json();

                // Get forecast data
                const forecastResponse = await fetch(
                    `${BASE_URL}/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`
                );
                const forecastData = await forecastResponse.json();

                // Get air quality data
                const airQualityResponse = await fetch(
                    `${BASE_URL}/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`
                );
                const airQualityData = await airQualityResponse.json();

                updateWeatherUI(weatherData, name, country, forecastData, airQualityData);
                showLoading(false);
            } catch (error) {
                console.error('Error fetching weather:', error);
                showError('Failed to fetch weather data. Please try again.');
                showLoading(false);
            }
        }

        function updateWeatherUI(weatherData, cityName, country, forecastData, airQualityData) {
            // Update main weather info
            document.getElementById('cityName').textContent = `${cityName}, ${country}`;
            document.getElementById('temp').textContent = `${Math.round(weatherData.main.temp)}°C`;
            document.getElementById('feelsLike').textContent = `${Math.round(weatherData.main.feels_like)}°C`;
            document.getElementById('humidity').textContent = `${weatherData.main.humidity}%`;
            document.getElementById('windSpeed').textContent = `${weatherData.wind.speed} m/s`;
            document.getElementById('description').textContent = weatherData.weather[0].description;

            // Update weather icon
            const iconCode = weatherData.weather[0].icon;
            document.getElementById('weatherIcon').textContent = getWeatherEmoji(iconCode);

            // Update detailed information
            document.getElementById('pressure').textContent = `${weatherData.main.pressure} hPa`;
            document.getElementById('visibility').textContent = `${(weatherData.visibility / 1000).toFixed(1)} km`;
            document.getElementById('sunrise').textContent = formatTime(weatherData.sys.sunrise);
            document.getElementById('sunset').textContent = formatTime(weatherData.sys.sunset);

            // Update air quality
            if (airQualityData.list && airQualityData.list.length > 0) {
                const aqi = airQualityData.list[0].main.aqi;
                const components = airQualityData.list[0].components;
                document.getElementById('aqiLevel').textContent = getAQILabel(aqi);
                document.getElementById('pm25').textContent = `${components.pm2_5?.toFixed(1) || '--'} μg/m³`;
                document.getElementById('pm10').textContent = `${components.pm10?.toFixed(1) || '--'} μg/m³`;
            }

            // Update forecast
            updateForecast(forecastData);
        }

        function updateForecast(forecastData) {
            const forecastGrid = document.getElementById('forecastGrid');
            forecastGrid.innerHTML = '';

            const dailyForecasts = {};

            forecastData.list.forEach(item => {
                const date = new Date(item.dt * 1000).toDateString();
                if (!dailyForecasts[date]) {
                    dailyForecasts[date] = item;
                }
            });

            Object.values(dailyForecasts).slice(0, 5).forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short' });
                const temp = Math.round(item.main.temp);
                const icon = getWeatherEmoji(item.weather[0].icon);

                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div class="day">${day}</div>
                    <div class="icon">${icon}</div>
                    <div class="temp">${temp}°C</div>
                `;
                forecastGrid.appendChild(forecastItem);
            });
        }

        function getWeatherEmoji(iconCode) {
            const emojiMap = {
                '01d': '☀️', '01n': '🌙',
                '02d': '⛅', '02n': '🌤️',
                '03d': '☁️', '03n': '☁️',
                '04d': '☁️', '04n': '☁️',
                '09d': '🌧️', '09n': '🌧️',
                '10d': '🌦️', '10n': '🌧️',
                '11d': '⛈️', '11n': '⛈️',
                '13d': '❄️', '13n': '❄️',
                '50d': '🌫️', '50n': '🌫️'
            };
            return emojiMap[iconCode] || '🌤️';
        }

        function getAQILabel(aqi) {
            const labels = ['Good', 'Fair', 'Moderate', 'Poor', 'Very Poor'];
            return labels[aqi - 1] || 'Unknown';
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Load default city on page load
        window.addEventListener('load', () => {
            document.getElementById('cityInput').value = 'Jakarta';
            searchWeather();
        });
    </script>
</body>
</html>
